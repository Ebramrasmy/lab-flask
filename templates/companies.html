<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Companies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #393a8d;
        }

        a.button {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #3a3ca7;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
        }

        th {
            background-color: #3a3ca7;
            color: white;
        }

        td a {
            color: #3a3ca7;
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        .back-link {
            margin-top: 20px;
            display: block;
            color: #3a3ca7;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Companies</h1>

    <a href="{{ url_for('create_company') }}" class="button">+ Add New Company</a>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Industry</th>
            <th>Employees</th>
        </tr>
        {% for company in companies %}
        <tr>
            <td>{{ company.id }}</td>
            <td><a href="{{ url_for('company_detail', id=company.id) }}">{{ company.name }}</a></td>
            <td>{{ company.location }}</td>
            <td>{{ company.industry }}</td>
            <td>{{ company.employees }}</td>
        </tr>
        {% endfor %}
    </table>

</body>
</html>
