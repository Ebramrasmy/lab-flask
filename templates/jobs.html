<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jobs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #393a8d;
        }
        a.button {
            display: inline-block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #3a3ca7;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        th {
            background-color: #3a3ca7;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Jobs</h1>

    <a href="{{ url_for('create_job') }}" class="button">+ Add New Job</a>

    <table>
        <tr>
            <th>Job ID</th>
            <th>Job Title</th>
            <th>Company</th>
            <th>Location</th>
        </tr>
        {% for job in jobs %}
        <tr>
            <td>{{ job.id }}</td>
            <td>{{ job.title }}</td>
            <td>{{ job.company.name }}</td>
            <td>{{ job.location }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
