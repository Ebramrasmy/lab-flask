<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ company.name }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #393a8d;
        }
        .details {
            margin: 40px auto;
            width: 50%;
            text-align: left;
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        a {
            text-decoration: none;
            color: #3a3ca7;
        }
    </style>
</head>
<body>
    <h1>{{ company.name }}</h1>
    <div class="details">
        <p><strong>ID:</strong> {{ company.id }}</p>
        <p><strong>Location:</strong> {{ company.location }}</p>
        <p><strong>Industry:</strong> {{ company.industry }}</p>
        <p><strong>Employees:</strong> {{ company.employees }}</p>
    </div>
    <a href="{{ url_for('list_companes') }}" style="display:inline-block; margin-top:20px; padding:10px 20px; background-color:#3a3ca7; color:white; border-radius:5px; text-decoration:none;">Back to Companies</a>
</body>
</html>
