<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Job</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            color: #333;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #3a3ca7;
        }

        form {
            display: inline-block;
            padding: 30px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 400px;
            text-align: left;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #3a3ca7;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #2e2f8d;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #3a3ca7;
        }
    </style>
</head>
<body>
    <h1>Create a New Job</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        
        <label for="title">{{ form.title.label }}</label>
        {{ form.title() }}

        <label for="location">{{ form.location.label }}</label>
        {{ form.location() }}

        <label for="company_id">{{ form.company_id.label }}</label>
        {{ form.company_id() }}

        {{ form.submit() }}
    </form>
    <br>
    <a href="{{ url_for('list_jobs') }}" class="back-link">← Back to Jobs</a>
</body>
</html>
